<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>喜乐瑜伽管理端浏览器截图验收索引</title>
    <style>
      :root {
        --ink: #1f2521;
        --muted: #667168;
        --line: #dce3dc;
        --paper: #f7f4ee;
        --panel: #ffffff;
        --brand: #66836f;
        --gold: #b89a63;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          system-ui,
          sans-serif;
      }

      .shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }

      aside {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 32px 28px;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 32px;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 8px;
        color: #fff;
        background: var(--brand);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
      }

      .summary {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      nav {
        display: grid;
        gap: 8px;
      }

      nav a {
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
      }

      nav a:hover {
        border-color: var(--line);
        background: #fff;
      }

      main {
        padding: 36px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 28px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .badge {
        padding: 8px 12px;
        border: 1px solid rgba(184, 154, 99, 0.42);
        border-radius: 999px;
        color: #6f5b30;
        background: rgba(184, 154, 99, 0.12);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 22px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 40px rgba(65, 72, 66, 0.09);
      }

      figure a {
        display: block;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 1440 / 1000;
        object-fit: cover;
        background: #f3f0e9;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-top: 1px solid var(--line);
      }

      figcaption strong {
        font-size: 15px;
      }

      figcaption span {
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .shell {
          display: block;
        }

        aside {
          position: static;
          height: auto;
        }

        main {
          padding: 24px 16px;
        }

        .toolbar {
          display: block;
        }

        .badge {
          display: inline-flex;
          margin-top: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <div class="mark">喜</div>
          <h1>管理端浏览器截图验收索引</h1>
        </div>
        <p class="summary">
          由 <code>python scripts\verify_admin_visual.py</code> 生成并校验。每张截图为 1440x1000，已检查非空像素和基础对比度。
        </p>
        <nav aria-label="截图导航">
          <a href="#login">登录页</a>
          <a href="#dashboard">数据看板</a>
          <a href="#teachers">教师管理</a>
          <a href="#reviews">年审管理</a>
          <a href="#studios">工作室管理</a>
          <a href="#analytics">数据分析</a>
          <a href="#settings">系统设置</a>
        </nav>
      </aside>
      <main>
        <div class="toolbar">
          <div>
            <h2>喜乐瑜伽后台视觉验收</h2>
            <p class="meta">用于快速检查管理端主要页面是否非空、比例正确、视觉风格一致。</p>
          </div>
          <div class="badge">7 screens verified</div>
        </div>

        <section class="grid">
          <figure id="login">
            <a href="login.png"><img src="login.png" alt="登录页截图" /></a>
            <figcaption><strong>登录页</strong><span>login.png</span></figcaption>
          </figure>
          <figure id="dashboard">
            <a href="dashboard.png"><img src="dashboard.png" alt="数据看板截图" /></a>
            <figcaption><strong>数据看板</strong><span>dashboard.png</span></figcaption>
          </figure>
          <figure id="teachers">
            <a href="teachers.png"><img src="teachers.png" alt="教师管理截图" /></a>
            <figcaption><strong>教师管理</strong><span>teachers.png</span></figcaption>
          </figure>
          <figure id="reviews">
            <a href="reviews.png"><img src="reviews.png" alt="年审管理截图" /></a>
            <figcaption><strong>年审管理</strong><span>reviews.png</span></figcaption>
          </figure>
          <figure id="studios">
            <a href="studios.png"><img src="studios.png" alt="工作室管理截图" /></a>
            <figcaption><strong>工作室管理</strong><span>studios.png</span></figcaption>
          </figure>
          <figure id="analytics">
            <a href="analytics.png"><img src="analytics.png" alt="数据分析截图" /></a>
            <figcaption><strong>数据分析</strong><span>analytics.png</span></figcaption>
          </figure>
          <figure id="settings">
            <a href="settings.png"><img src="settings.png" alt="系统设置截图" /></a>
            <figcaption><strong>系统设置</strong><span>settings.png</span></figcaption>
          </figure>
        </section>
      </main>
    </div>
  </body>
</html>
